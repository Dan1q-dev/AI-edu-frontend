map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    '' $scheme;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $forwarded_scheme; proxy_set_header X-Real-IP $remote_addr; }
    location /static/ { alias /static/; }
    location / { try_files $uri $uri/ /index.html; }
}
