services:
  frontend:
    build:
      context: .
      target: development
    env_file: .env
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:5173"]
    networks: [aiedu]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
networks:
  aiedu:
    external: true
    name: aiedu-platform
